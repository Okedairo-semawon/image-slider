<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="practice.css">
</head>
<body>
    <div class="product-gallery">
        <!-- main images -->
        <div class="main-image-container">
            <!-- prev button  -->
            <button class="nav-btn prev" id="prevBtn">&#10094</button>
            <img src="images/freepik__a-nigerian-traditional-wear-with-black-background__87258.png" id="mainImage" alt="Product Image" class="main-image" >
            <!--  next button -->
            <button class="nav-btn next" id="nextBtn">&#10095</button>
        </div>

        <!-- Thumbnails  -->
        <div class="thumbnail-container">
            <img src="images/freepik__a-tailor-back-ground-with-black-background__69765.png" alt="product thumbnail 1" class="thumbnail active">
            <img src="images/freepik__suits-with-a-black-background__13120.png" alt="product thumbnail 2" class="thumbnail">
            <img src="images/WhatsApp Image 2026-03-25 at 10.07.10 PM.jpeg" alt="product thumbnail 3" class="thumbnail">
            <img src="image/ solar-services-mages copy.jpeg" alt="product thumbnail 4" class="thumbnail">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
